name: generate-ig-image

# Instagram 投稿用の画像を日次生成する。
# buffer-refill routine（03:03 UTC）より前に終わらせる必要があるため 02:30 UTC に走らせる。
# OPENAI_API_KEY は GitHub Secrets にのみ存在し、cloud environment には置かない。
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      theme_index:
        description: "テーマ番号を明示指定（空なら日付ベースのローテーション）"
        type: string
        required: false
        default: ""

# 同時実行を禁止する。cron と手動実行が重なると同じファイル名へ二重 commit して push が衝突する。
concurrency:
  group: generate-ig-image
  cancel-in-progress: false

# images/ と latest.json を commit するために必要。
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      # 見出しは SVG で焼き込む方式（2026-07-18 の最終解）だが、SVG を描画する librsvg は
      # @font-face の file:// 指定を読まず、fontconfig に登録されたフォントしか使えない。
      # そのため OS 側に本物の Noto Sans CJK を入れ、スクリプトが指定する font-family 名
      # (NotoSansJPBold) を alias でそこへ向ける。generate-ig-image.mjs は無改造のまま動く。
      - name: Install Japanese font (fontconfig)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias binding="strong">
              <family>NotoSansJPBold</family>
              <prefer><family>Noto Sans CJK JP</family></prefer>
            </alias>
          </fontconfig>
          EOF
          fc-cache -f
          echo "--- 解決結果（NotoSansJPBold が実フォントに解決されること） ---"
          fc-match "NotoSansJPBold:bold"
          fc-match "NotoSansJPBold:bold" | grep -qi "notosanscjk" || {
            echo "::error::NotoSansJPBold が Noto Sans CJK に解決されていない"; exit 1; }

      - name: Generate image
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THEME_INDEX: ${{ github.event.inputs.theme_index }}
        run: node scripts/run-daily.mjs

      - name: Commit and push
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "変更なし。commit をスキップする。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images latest.json
          git commit -m "chore: generate ig image $(date -u +%Y-%m-%d)"
          git push
